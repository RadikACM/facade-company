<div class="login-wrapper">
  <div class="login-card">
    <!-- Шапка карточки -->
    <div class="login-header">
      <div class="brand-badge">
        <span class="accent-dot"></span>
        <span>Admin Panel</span>
      </div>
      <h1 class="login-title">Вход в систему</h1>
      <p class="login-subtitle">Введите свои данные для доступа к панели</p>
    </div>

    <!-- Форма авторизации -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="email">Электронная почта</label>
        <div class="input-wrapper">
          <input 
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="kusurait@gmail.com"
            required
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <div class="input-wrapper">
          <input 
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="••••••••••"
            required
            autocomplete="current-password"
          />
        </div>
      </div>

      <!-- Сообщение об ошибке авторизации (если есть) -->
      @if (error()) {
        <div class="error-banner">
          {{ error() }}
        </div>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid || isSubmitting()">
        @if (isSubmitting()) {
          <span class="spinner"></span>
          <span>Вход...</span>
        } @else {
          <span>Войти</span>
        }
      </button>
    </form>
  </div>
</div>
