<section class="news-section">
  <div class="container">
    <div class="section-header">
      <h2>Новости и публикации</h2>
      <p class="subtitle">
        Делимся опытом в области фасадных технологий, новинками материалов и процессами производства.
      </p>
    </div>

    @if (posts$ | async; as posts) {
      <div class="news-grid full-width">
        @for (post of posts; track post.id) {
          <app-news-card [post]="post" [showFullContent]="true" />
        } @empty {
          <p class="empty">Записей пока нет.</p>
        }
      </div>
    } @else {
      <p class="loading">Загрузка новостей...</p>
    }
  </div>
</section>
