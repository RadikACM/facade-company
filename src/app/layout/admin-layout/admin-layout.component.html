<div class="admin-layout">
  <!-- Боковая панель -->
  <aside class="admin-sidebar" [class.is-open]="isSidebarOpen()">
    <div class="sidebar-brand">
      <span class="accent-dot"></span>
      <span>Admin Panel</span>
    </div>
    
    <nav class="sidebar-nav">
      <a routerLink="." routerLinkActive="active" class="nav-item">
        <span class="icon"><img src="/icons/dashboard.svg" alt=""></span> Дашборд
      </a>
      <a routerLink="projects" routerLinkActive="active" class="nav-item">
        <span class="icon"><img src="/icons/folder.svg" alt=""></span> Проекты
      </a>
      <a routerLink="news" routerLinkActive="active" class="nav-item">
        <span class="icon"><img src="/icons/news.svg" alt=""></span> Новости
      </a>
      <a routerLink="contacts" routerLinkActive="active" class="nav-item">
        <span class="icon"><img src="/icons/contact.svg" alt=""></span> Контакты
      </a>
      <a routerLink="services" routerLinkActive="active" class="nav-item">
        <span class="icon"><img src="/icons/build.svg" alt=""></span> Услуги
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" class="back-link">Вернуться на сайт</a>
    </div>
  </aside>

  <!-- Задний фон-затемнение на мобилках -->
  <div class="sidebar-backdrop" [class.is-visible]="isSidebarOpen()" (click)="closeSidebar()"></div>

  <!-- Главный рабочий контент -->
  <main class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" aria-label="Toggle menu" (click)="toggleSidebar()">
        <span class="burger">
          <img src="/icons/menu-admin.svg" alt="">
        </span>
      </button>
      <div class="user-profile">
        <span class="avatar">A</span>
        <span class="username">Admin</span>
      </div>
    </header>
    
    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
