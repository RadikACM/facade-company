<article class="project-card">
  <div class="project-card-image">
    <img
      class="project-card-photo"
      [src]="activeImage"
      [alt]="project.title"
    >
  </div>

  <div class="project-card-content">
    <h3 class="project-card-title">{{ project.title }}</h3>

    <div class="project-card-meta">
      <span class="project-card-category">{{ project.category }}</span>
      <span class="project-card-year">{{ project.year }}</span>
    </div>

    <p class="project-card-description">{{ project.description }}</p>

    <!-- Отрисовка галереи -->
    @if (project.gallery && project.gallery.length > 0) {
      <div class="project-card-gallery">
        <!-- Кнопка с главным фото, если хочется вернуться к нему -->
        <button 
          type="button" 
          class="gallery-thumb"
          [class.active]="activeImage === project.imageUrl"
          (click)="selectImage(project.imageUrl)"
        >
          <img [src]="project.imageUrl" [alt]="project.title">
        </button>

        <!-- Остальные изображения галереи -->
        @for (img of project.gallery; track $index) {
          <button 
            type="button" 
            class="gallery-thumb"
            [class.active]="activeImage === img"
            (click)="selectImage(img)"
          >
            <img [src]="img" [alt]="project.title + ' фото ' + ($index + 1)">
          </button>
        }
      </div>
    }
  </div>
</article>
